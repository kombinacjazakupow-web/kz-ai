<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>KOMBI Sklep</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <style>html{background:#fff}</style>
  <script>
    (function () {
      var path = location.pathname;
      var dir = path.endsWith('/') ? path : path.replace(/[^/]*$/, '');
      var hash = location.hash || '';
      var search = location.search || '';
      function shopHash(value) {
        var raw = String(value || '').replace(/^#/, '');
        if (!raw) return false;
        if (raw.charAt(0) !== '/') raw = '/' + raw;
        var route = raw.split('?')[0].replace(/\/+$/, '') || '/';
        if (route === '/koszyk' || route === '/zamowienie' || route === '/moje' || route === '/konto' || route === '/rolki') return true;
        return /^\/p\/[^/]+$/.test(route);
      }
      var packingHash = hash && hash !== '#';
      var authReturn = /(?:^|[?&])(code|error|error_description|access_token|refresh_token)=/.test(search);
      var packingPhone = false;
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i) || '';
          if (key === 'kombi-tick-queue' || key.indexOf('kombi-tick-queue:') === 0 || key.indexOf('sb-ghhatjkcgilnruluhxyr-auth-token') === 0) {
            packingPhone = true;
            break;
          }
        }
      } catch (err) { /* private mode opens the shop */ }
      if (shopHash(hash)) location.replace(dir + 'shop/' + search + hash);
      else if (packingHash || authReturn || packingPhone) location.replace(dir + 'pakowanie/' + search + hash);
      else location.replace(dir + 'shop/' + search);
    })();
  </script>
</head>
<body>
  <noscript><p><a href="shop/">KOMBI Sklep</a></p></noscript>
</body>
</html>
